    <div style="margin: 0 10px;">
        <div style="position: relative;" class="container zerodha">
            <h1 style="display: flex; justify-content: space-evenly; align-items: center; width: 100%; text-shadow: 0 0 5px black;">Zerodha Charges 
                <select id="lot" style="all: unset; padding: 2px 10px; font-size: 20px; border: 1px solid black; border-radius: 5px; display: flex; justify-content: center; align-items: center;" name="lotNum">
                    <option style="color: black; background-color: rgb(0,0,0,0.2);" value="25">1 Lot = 25</option>
                    <option style="color: black; background-color: rgb(0,0,0,0.2);" value="50" selected>1 Lot = 50</option>
                </select>
            </h1>
            <div style="display: flex; justify-content: space-around; margin: 14px 0; width: 100%; flex-wrap: wrap; row-gap: 10px;" class="row-one">
                <input id="cp" style="width: 40%; height: 30px;" type="text" placeholder="Buying Price">
                <input id="sp" style="width: 40%; height: 30px;" type="text" placeholder="Selling Price">
                <input id="lots" style="width: 90%; height: 30px;" type="number" placeholder="Number of Lots">
            </div>
    
            <div class="result" style="border: 1px solid black; width: 93%; border-radius: 10px; height: 200px; margin: 4px auto; margin-bottom: 70px;">
                <p>Total Charge: <span id="totalCharge"></span></p>
                <p>Net Profit and Loss: <span id="netPnL"></span></p>
                <p>Result: <span id="result"></span></p>
            </div>
    
            <button onclick="getCharge()" style="position: absolute; bottom: 10px; right: 10px;">Submit</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
